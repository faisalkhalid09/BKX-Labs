<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Preconnect first — must be before any external resource reference -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.googletagmanager.com">

  <!-- Google Analytics (GA4) — async, never blocks rendering -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R9R44GVLGG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R9R44GVLGG');
  </script>

  <!-- Google Fonts — non-blocking (print trick: loads async, then applies) -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap">
  </noscript>

  <!-- Preload critical assets -->
  <link rel="preload" as="image" href="/brand-logo.png?v=2" fetchpriority="high" />

  <!-- Primary Meta Tags -->
  <title>BKX Labs | Laravel &amp; React Software Rescue Agency</title>
  <meta name="description" content="BKX Labs (bkxlabs.com) rescues stalled Laravel and React projects: forensic codebase audits, emergency stabilisation, technical debt remediation, and fixed-price greenfield delivery for international teams." />
  <meta name="author" content="BKX Labs - Faisal Khalid" />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="English" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://bkxlabs.com/" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bkxlabs.com/" />
  <meta property="og:title" content="BKX Labs | Laravel &amp; React Software Rescue Agency" />
  <meta property="og:description" content="BKX Labs (bkxlabs.com) rescues stalled Laravel and React projects. Forensic audits, emergency stabilisation, technical debt remediation, fixed-price delivery." />
  <meta property="og:image" content="https://bkxlabs.com/brand-logo.png" />
  <meta property="og:site_name" content="BKX Labs" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BKX Labs | Laravel &amp; React Software Rescue Agency" />
  <meta name="twitter:description" content="BKX Labs (bkxlabs.com) rescues stalled software projects. Forensic codebase audits, emergency triage, and long-term modernisation for international teams." />
  <meta name="twitter:image" content="https://bkxlabs.com/brand-logo.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Structured Data - @graph schema (Organization + WebSite + WebPage + ProfessionalService) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "ProfessionalService"],
          "@id": "https://bkxlabs.com/#organization",
          "name": "BKX Labs",
          "alternateName": ["bkxlabs", "BKXLabs", "BKX Labs Agency"],
          "url": "https://bkxlabs.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://bkxlabs.com/brand-logo.png"
          },
          "description": "BKX Labs (bkxlabs) is an enterprise-grade software rescue agency specialising in taking over stalled Laravel and React projects, eliminating technical debt, and delivering production-ready solutions for international businesses.",
          "founder": {
            "@type": "Person",
            "name": "Faisal Khalid",
            "url": "https://www.linkedin.com/in/faisal-khalid1622/"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "contact@bkxlabs.com",
            "contactType": "Customer Support",
            "availableLanguage": "English",
            "areaServed": ["US", "GB", "AU", "CA", "EU"]
          },
          "priceRange": "$$-$$$",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Software Rescue Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Diagnostic Codebase Audit" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Emergency Triage & Stabilization" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Modernisation Retainer" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Greenfield Development" } }
            ]
          },
          "sameAs": [
            "https://www.linkedin.com/company/bkxlabs",
            "https://www.linkedin.com/in/faisal-khalid1622/"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://bkxlabs.com/#website",
          "url": "https://bkxlabs.com/",
          "name": "BKX Labs",
          "alternateName": ["bkxlabs", "BKXLabs", "BKX Labs Agency"],
          "publisher": { "@id": "https://bkxlabs.com/#organization" }
        },
        {
          "@type": "WebPage",
          "@id": "https://bkxlabs.com/#webpage",
          "url": "https://bkxlabs.com/",
          "name": "BKX Labs | Laravel & React Software Rescue Agency",
          "isPartOf": { "@id": "https://bkxlabs.com/#website" },
          "about": { "@id": "https://bkxlabs.com/#organization" }
        }
      ]
    }
  </script>



</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Google AdSense — injected only when browser is idle, never during initial load -->
  <script>
    (function() {
      var loadAds = function() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8538157876247266';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      };
      // Load ads only when browser is idle (after page content is interactive)
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadAds, { timeout: 4000 });
      } else {
        // Fallback for Safari: wait 3s after load
        window.addEventListener('load', function() {
          setTimeout(loadAds, 3000);
        });
      }
    })();
  </script>
</body>

</html>
