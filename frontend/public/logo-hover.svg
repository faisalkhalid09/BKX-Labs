<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="60" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Top-left to bottom-right stroke -->
  <path d="M 50 50 L 150 150" stroke="url(#grad1)" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Bottom-left to top-right stroke -->
  <path d="M 150 50 L 50 150" stroke="url(#grad1)" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Decorative outer rings for depth -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="1" opacity="0.15"/>
</svg>
