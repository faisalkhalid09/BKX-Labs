    # ── C. Backend Dynamic Routes ─────────────────────────
    location ~ ^/(admin|api|store|login|register|logout|verify-otp|checkout|downloads|livewire|profile|webhook|sitemap\.xml) {
        root /var/www/BKX-Labs/backend/public;
        try_files $uri $uri/ @backend;
    }

    # ── D. FastCGI Hand-off ───────────────────────────────
    location @backend {
        root /var/www/BKX-Labs/backend/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;

        # Ensure the Laravel backend knows the external connection is secure
        fastcgi_param HTTPS 'on';
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

